name: Build
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnfc-dev pkg-config
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libnfc pkg-config
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: choco install mingw make -y --no-progress
      - name: Clean build
        run: make clean && make
      - name: CLI checks
        run: python3 tests/test_cli.py
      - name: Windows environment compatibility
        if: runner.os == 'Windows'
        run: |
          gcc -Werror tests/windows_env_test.c src/common/nfc_windows_env.c -o build/windows_env_test.exe
          ./build/windows_env_test.exe
      - name: Discovery checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -D_POSIX_C_SOURCE=200809L -Isrc $(pkg-config --cflags libnfc) tests/discovery_test.c src/common/platform.c -o build-discovery-test
          ./build-discovery-test
